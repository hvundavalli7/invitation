    <path d="M48 46 Q52 43 56 46"/>
    <path d="M64 46 Q68 43 72 46"/>
    <circle cx="51" cy="47" r="1.2" fill="#c45a3a" stroke="none"/>
    <circle cx="69" cy="47" r="1.2" fill="#c45a3a" stroke="none"/>
    <!-- Tilak -->
    <path d="M60 36 L60 42"/>
    <circle cx="60" cy="34" r="1.4" fill="#c45a3a" stroke="none"/>
    <!-- Trunk curling left -->
    <path d="M60 56 C58 64 52 70 48 74 C42 80 40 88 46 92 C50 95 56 92 58 86 C60 80 56 76 52 78"/>
    <!-- Tusk -->
    <path d="M56 62 C62 64 68 60 70 56"/>
