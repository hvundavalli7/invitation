    <path d="M44 70 C40 78 36 86 38 94"/>
    <path d="M76 70 C80 78 84 86 82 94"/>
    <!-- Upper body / belly -->
    <path d="M38 94 C36 104 44 112 60 112 C76 112 84 104 82 94"/>
    <path d="M46 96 C50 104 70 104 74 96"/>
    <!-- Hands in blessing / holding modak suggestion -->
    <path d="M38 88 C28 90 24 98 28 104 C32 108 38 104 40 98"/>
    <path d="M82 88 C92 90 96 98 92 104 C88 108 82 104 80 98"/>
    <!-- Small modak in left hand -->
    <path d="M26 100 C28 96 34 96 36 100 C34 104 28 104 26 100Z" fill="#c45a3a" fill-opacity="0.15"/>
    <!-- Lotus base hint -->
    <path d="M42 112 C48 116 54 118 60 118 C66 118 72 116 78 112" opacity="0.7"/>
