<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220" fill="none">
  <defs>
    <linearGradient id="cb-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c5d6c0"/>
      <stop offset="100%" stop-color="#a2b992"/>
    </linearGradient>
    <linearGradient id="cb-leaf-deep" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fa87e"/>
      <stop offset="100%" stop-color="#a2b992" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="cb-rose" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0cdd6"/>
      <stop offset="55%" stop-color="#e8b4c0"/>
      <stop offset="100%" stop-color="#c45b7a" stop-opacity="0.75"/>
    </radialGradient>
    <radialGradient id="cb-yellow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f5e6b8"/>
      <stop offset="100%" stop-color="#c9a872" stop-opacity="0.8"/>
    </radialGradient>
    <radialGradient id="cb-blue" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e8f0f6"/>
      <stop offset="100%" stop-color="#8fa8c4" stop-opacity="0.75"/>
    </radialGradient>
  </defs>

  <!-- Corner cluster: bottom-left origin style, can be flipped via CSS -->
  <!-- Palm-ish fronds sweeping from corner -->
  <g opacity="0.9">
    <path d="M12 208 C40 180 70 140 88 90" stroke="#8fa87e" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
    <path d="M88 92 C70 100 48 108 28 112 C50 104 72 96 88 92Z" fill="url(#cb-leaf)" opacity="0.85"/>
    <path d="M78 118 C58 128 36 138 16 140 C40 132 62 122 78 118Z" fill="url(#cb-leaf-deep)" opacity="0.8"/>
    <path d="M68 144 C50 156 30 168 12 172 C34 162 54 150 68 144Z" fill="url(#cb-leaf)" opacity="0.78"/>
    <path d="M56 168 C42 180 26 192 10 198 C28 188 44 176 56 168Z" fill="url(#cb-leaf-deep)" opacity="0.75"/>

    <path d="M20 200 C50 190 100 160 130 120" stroke="#a2b992" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
    <path d="M128 122 C118 136 100 150 80 160 C102 146 118 132 128 122Z" fill="url(#cb-leaf)" opacity="0.7"/>
    <path d="M108 148 C96 164 78 180 58 190 C80 174 96 158 108 148Z" fill="url(#cb-leaf-deep)" opacity="0.68"/>
    <path d="M90 172 C78 186 62 200 44 208 C64 194 80 180 90 172Z" fill="url(#cb-leaf)" opacity="0.65"/>
  </g>

  <!-- Soft oval leaves -->
  <ellipse cx="46" cy="150" rx="18" ry="8" fill="url(#cb-leaf)" opacity="0.7" transform="rotate(-40 46 150)"/>
  <ellipse cx="70" cy="176" rx="16" ry="7" fill="url(#cb-leaf-deep)" opacity="0.65" transform="rotate(-55 70 176)"/>
  <ellipse cx="100" cy="196" rx="20" ry="7" fill="url(#cb-leaf)" opacity="0.6" transform="rotate(-70 100 196)"/>

  <!-- Rose bloom -->
  <g transform="translate(36 48)">
    <ellipse cx="28" cy="8" rx="12" ry="16" fill="url(#cb-rose)" opacity="0.8"/>
    <ellipse cx="10" cy="20" rx="14" ry="12" fill="url(#cb-rose)" opacity="0.78" transform="rotate(-30 10 20)"/>
    <ellipse cx="46" cy="20" rx="14" ry="12" fill="url(#cb-rose)" opacity="0.78" transform="rotate(30 46 20)"/>
    <ellipse cx="16" cy="40" rx="12" ry="11" fill="url(#cb-rose)" opacity="0.7"/>
    <ellipse cx="40" cy="40" rx="12" ry="11" fill="url(#cb-rose)" opacity="0.7"/>
    <circle cx="28" cy="28" r="9" fill="#c45b7a" opacity="0.55"/>
    <circle cx="28" cy="26" r="4" fill="#f0cdd6" opacity="0.7"/>
  </g>

  <!-- Small yellow flower -->
  <g transform="translate(118 78)">
    <ellipse cx="16" cy="4" rx="5" ry="8" fill="url(#cb-yellow)" opacity="0.9"/>
    <ellipse cx="26" cy="12" rx="5" ry="8" fill="url(#cb-yellow)" opacity="0.88" transform="rotate(72 16 16)"/>
    <ellipse cx="22" cy="24" rx="5" ry="8" fill="url(#cb-yellow)" opacity="0.86" transform="rotate(144 16 16)"/>
    <ellipse cx="10" cy="24" rx="5" ry="8" fill="url(#cb-yellow)" opacity="0.86" transform="rotate(216 16 16)"/>
    <ellipse cx="6" cy="12" rx="5" ry="8" fill="url(#cb-yellow)" opacity="0.88" transform="rotate(288 16 16)"/>
    <circle cx="16" cy="16" r="4" fill="#e8c97a"/>
  </g>

  <!-- Small blue butterfly bloom -->
  <g transform="translate(92 28)">
    <ellipse cx="8" cy="10" rx="9" ry="12" fill="url(#cb-blue)" opacity="0.85" transform="rotate(-25 8 10)"/>
    <ellipse cx="24" cy="10" rx="9" ry="12" fill="url(#cb-blue)" opacity="0.85" transform="rotate(25 24 10)"/>
    <ellipse cx="10" cy="24" rx="7" ry="10" fill="url(#cb-blue)" opacity="0.75" transform="rotate(25 10 24)"/>
    <ellipse cx="22" cy="24" rx="7" ry="10" fill="url(#cb-blue)" opacity="0.75" transform="rotate(-25 22 24)"/>
    <circle cx="16" cy="16" r="4" fill="#c9a872" opacity="0.75"/>
  </g>

  <!-- Tiny cream buds -->
  <circle cx="160" cy="110" r="4" fill="#e8b4c0" opacity="0.65"/>
  <circle cx="172" cy="124" r="3" fill="#e0c9a0" opacity="0.6"/>
  <circle cx="148" cy="136" r="3.5" fill="#c5d6c0" opacity="0.7"/>
</svg>
