<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" fill="none">
  <defs>
    <linearGradient id="env-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8ceb8"/>
      <stop offset="100%" stop-color="#a8c3a8"/>
    </linearGradient>
    <linearGradient id="env-flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c5d6c0"/>
      <stop offset="100%" stop-color="#a8c3a8"/>
    </linearGradient>
    <linearGradient id="env-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9f6f1"/>
      <stop offset="100%" stop-color="#f3eee6"/>
    </linearGradient>
    <radialGradient id="seal-grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e0c9a0"/>
      <stop offset="70%" stop-color="#c9a872"/>
      <stop offset="100%" stop-color="#a88955"/>
    </radialGradient>
    <pattern id="floral" width="40" height="40" patternUnits="userSpaceOnUse">
      <!-- Tiny cream floral motif -->
      <circle cx="20" cy="20" r="1.6" fill="#fffdf9" opacity="0.55"/>
      <ellipse cx="20" cy="14" rx="2.2" ry="3.5" fill="#fffdf9" opacity="0.4"/>
      <ellipse cx="20" cy="26" rx="2.2" ry="3.5" fill="#fffdf9" opacity="0.4"/>
      <ellipse cx="14" cy="20" rx="3.5" ry="2.2" fill="#fffdf9" opacity="0.4"/>
      <ellipse cx="26" cy="20" rx="3.5" ry="2.2" fill="#fffdf9" opacity="0.4"/>
      <path d="M8 8 Q12 4 16 8" stroke="#fffdf9" stroke-width="0.7" opacity="0.3" fill="none"/>
      <path d="M28 32 Q32 28 36 32" stroke="#fffdf9" stroke-width="0.7" opacity="0.25" fill="none"/>
    </pattern>
    <filter id="env-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#5c4038" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Soft ground shadow -->
  <ellipse cx="200" cy="298" rx="150" ry="12" fill="#5c4038" opacity="0.1"/>

  <g filter="url(#env-shadow)">
    <!-- Envelope body -->
    <rect x="40" y="90" width="320" height="200" rx="6" fill="url(#env-body)"/>
    <!-- Side folds suggestion -->
    <path d="M40 90 L160 200 L40 290" fill="#9bb89b" opacity="0.35"/>
    <path d="M360 90 L240 200 L360 290" fill="#9bb89b" opacity="0.35"/>
    <!-- Bottom fold -->
    <path d="M40 290 L200 210 L360 290 L360 290 L40 290Z" fill="#96b496" opacity="0.4"/>
    <!-- Inner paper peek -->
    <rect x="70" y="110" width="260" height="150" rx="2" fill="url(#env-inner)" opacity="0.95"/>
    <text x="200" y="185" text-anchor="middle" fill="#c45b7a" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic" opacity="0.55">You're Invited</text>

    <!-- Top flap (closed triangle) -->
    <path d="M40 90 L200 210 L360 90 Z" fill="url(#env-flap)"/>
    <!-- White floral pattern on flap -->
    <path d="M40 90 L200 210 L360 90 Z" fill="url(#floral)" opacity="0.85"/>
    <!-- Flap edge highlight -->
    <path d="M40 90 L200 210 L360 90" stroke="#fffdf9" stroke-width="1.2" opacity="0.35" fill="none"/>
  </g>

  <!-- Gold circular seal with A & H -->
  <g transform="translate(200 178)">
    <circle r="38" fill="url(#seal-grad)"/>
    <circle r="32" fill="none" stroke="#f5ecd4" stroke-width="1.4" opacity="0.7"/>
    <circle r="28" fill="none" stroke="#a88955" stroke-width="0.8" opacity="0.55"/>
    <!-- Decorative dots around seal -->
    <g fill="#f5ecd4" opacity="0.75">
      <circle cx="0" cy="-34" r="1.6"/>
      <circle cx="24" cy="-24" r="1.4"/>
      <circle cx="34" cy="0" r="1.6"/>
      <circle cx="24" cy="24" r="1.4"/>
      <circle cx="0" cy="34" r="1.6"/>
      <circle cx="-24" cy="24" r="1.4"/>
      <circle cx="-34" cy="0" r="1.6"/>
      <circle cx="-24" cy="-24" r="1.4"/>
    </g>
    <text x="0" y="7" text-anchor="middle" fill="#fffdf9" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="600" letter-spacing="1">A &amp; H</text>
  </g>
</svg>
