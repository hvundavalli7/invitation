  <path d="M88 186 C120 200 152 210 176 204 C148 208 114 196 88 186Z" fill="url(#lr-deep)" opacity="0.8"/>
  <path d="M86 208 C114 226 142 242 164 240 C138 240 108 222 86 208Z" fill="url(#lr-blade)" opacity="0.84"/>
  <path d="M84 230 C108 250 130 268 150 270 C126 266 102 246 84 230Z" fill="url(#lr-deep)" opacity="0.78"/>
