  <path d="M94 116 C62 112 32 96 14 76 C34 94 64 110 94 116Z" fill="url(#lr-blade)" opacity="0.74"/>
  <path d="M92 138 C60 138 28 126 10 108 C30 124 62 136 92 138Z" fill="url(#lr-deep)" opacity="0.7"/>
  <path d="M90 160 C58 164 26 156 8 140 C28 154 60 162 90 160Z" fill="url(#lr-blade)" opacity="0.72"/>
  <path d="M88 182 C60 192 32 190 14 178 C34 188 62 188 88 182Z" fill="url(#lr-deep)" opacity="0.68"/>
  <path d="M86 204 C62 218 40 222 24 214 C42 220 64 214 86 204Z" fill="url(#lr-blade)" opacity="0.7"/>
  <!-- Soft tip wash -->
  <ellipse cx="108" cy="20" rx="10" ry="14" fill="#c5d6c0" opacity="0.35" filter="url(#lr-soft)"/>
  <!-- Colorful flower accents along the frond -->
  <g>
    <ellipse cx="152" cy="86" rx="7" ry="10" fill="#f4a7b9" transform="rotate(20 152 86)"/>
