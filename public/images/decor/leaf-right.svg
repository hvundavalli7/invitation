<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300" viewBox="0 0 200 300" fill="none">
  <defs>
    <linearGradient id="lr-blade" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a2b992" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#c5d6c0" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#8fa87e" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="lr-deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8fa87e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a2b992" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="lr-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>
  <!-- Mirrored palm frond stem -->
  <path d="M82 288 C88 220 92 150 98 80 C101 48 104 28 108 12" stroke="#8fa87e" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
